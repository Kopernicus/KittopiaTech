name: release

on:
  release:
    types: 
      - published

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KittopiaTech
          path: KittopiaTech
      - uses: actions/download-artifact@v4
        with:
          name: KittopiaTech.version
      - run: tree

      - name: Create Zip
        run: |
          cd KittopiaTech
          zip -r9 ../KittopiaTech.zip *

      - name: Upload Release Assets
        run: |
          gh release upload --clobber ${{ github.ref_name }}  \
            KittopiaTech.zip                  \
            KittopiaTech.version
